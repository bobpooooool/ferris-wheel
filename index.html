<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=1920"/>
<title>대관람차 타이머</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
#app { width: 1920px; height: 1080px; background: linear-gradient(180deg,#7EC8E3 0%,#A4D8EC 45%,#C8ECF8 75%,#E0F4FA 100%); position: relative; overflow: hidden; }
.cloud { position: absolute; border-radius: 60px; background: rgba(255,255,255,0.82); animation: drift 8s ease-in-out infinite; }
@keyframes drift { 0%,100%{transform:translateX(0)} 50%{transform:translateX(12px)} }
#ground { position: absolute; bottom: 0; left: 0; right: 0; height: 120px; background: linear-gradient(180deg,#72B860,#4A9038); }
#hint { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.22); color: rgba(255,255,255,0.95); font-size: 18px; padding: 8px 24px; border-radius: 20px; white-space: nowrap; z-index: 10; }
#start-btn { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); background: #E8302A; color: #fff; border: none; padding: 16px 60px; border-radius: 40px; font-size: 20px; font-weight: 700; cursor: pointer; z-index: 20; opacity: 0.35; pointer-events: none; transition: opacity 0.3s, transform 0.2s; }
#start-btn.on { opacity: 1; pointer-events: all; }
#start-btn.on:hover { transform: translateX(-50%) scale(1.05); }

/* 일시정지 버튼 */
#pause-btn { position: absolute; bottom: 150px; right: 80px; background: rgba(255,255,255,0.9); color: #333; border: none; padding: 14px 32px; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; z-index: 20; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.12); transition: all 0.2s; }
#pause-btn:hover { background: #fff; transform: scale(1.05); }

#gondola-grid { position: absolute; bottom: 260px; left: 50%; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; max-width: 1600px; z-index: 15; transition: opacity 0.5s; }
.gondola-grid-item { width: 120px; height: 90px; border-radius: 20px; background: #E8302A; border: 3px solid #B82020; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; position: relative; transition: transform 0.15s, background 0.15s; user-select: none; box-shadow: 0 4px 16px rgba(232,48,42,0.3); }
.gondola-grid-item:hover { transform: scale(1.1) translateY(-4px); background: #FF5A50; }
.gondola-grid-item.filled { border-color: #FFB0B0; }
.gondola-num { color: rgba(255,255,255,0.95); font-size: 28px; font-weight: 700; }
.gondola-name-small { color: #fff; font-size: 12px; margin-top: 4px; max-width: 110px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gondola-check { position: absolute; top: 6px; right: 10px; color: #fff; font-size: 16px; font-weight: bold; }
.gondola-label-tag { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.96); color: #E8302A; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 8px; white-space: nowrap; border: 1px solid rgba(232,48,42,0.25); }
#ferris-canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -48%); z-index: 4; }
.flying-gondola { position: absolute; width: 96px; height: 72px; border-radius: 16px; background: #E8302A; border: 2.5px solid #B82020; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; pointer-events: none; transition: left 0.8s cubic-bezier(0.4,0,0.2,1), top 0.8s cubic-bezier(0.4,0,0.2,1), opacity 0.4s; }
.flying-gondola .fg-num { color: #fff; font-size: 20px; font-weight: 700; }
.flying-gondola .fg-name { color: rgba(255,255,255,0.9); font-size: 11px; margin-top: 2px; max-width: 86px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#timer-ui { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; text-align: center; }
#timer-task { font-size: 24px; font-weight: 600; color: rgba(255,255,255,0.95); margin-bottom: 8px; }
#timer-time { font-size: 80px; font-weight: 700; color: #fff; letter-spacing: 2px; text-shadow: 0 2px 20px rgba(0,0,0,0.2); }
#timer-progress { width: 480px; height: 8px; background: rgba(255,255,255,0.3); border-radius: 4px; margin: 14px auto 0; }
#timer-bar { height: 100%; background: #E8302A; border-radius: 4px; transition: width 1s linear; }
#timer-count { font-size: 15px; color: rgba(255,255,255,0.7); margin-top: 10px; }
#transition-banner { position: absolute; top: 0; left: 0; right: 0; background: rgba(232,48,42,0.92); color: #fff; text-align: center; padding: 20px; font-size: 22px; font-weight: 700; z-index: 50; display: none; animation: slideDown 0.4s ease; }
@keyframes slideDown { from{transform:translateY(-100%)} to{transform:translateY(0)} }

/* 일시정지 배너 */
#pause-banner { position: absolute; top: 0; left: 0; right: 0; background: rgba(50,50,80,0.88); color: #fff; text-align: center; padding: 16px; font-size: 20px; font-weight: 600; z-index: 50; display: none; }

/* 토스트 알림 (5-A: 시간 0 방지 등) */
#toast { position: absolute; bottom: 200px; left: 50%; transform: translateX(-50%); background: rgba(50,50,50,0.9); color: #fff; padding: 12px 28px; border-radius: 16px; font-size: 15px; z-index: 300; display: none; white-space: nowrap; }

/* 회고 오버레이 */
#review-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; }
#review-card { background: #fff; border-radius: 28px; padding: 40px 36px; width: 560px; box-shadow: 0 12px 48px rgba(0,0,0,0.25); animation: popUp 0.3s ease; }
@keyframes popUp { from{transform:scale(0.92);opacity:0} to{transform:scale(1);opacity:1} }
.review-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.review-badge { background: #E8302A; color: #fff; font-size: 13px; padding: 4px 14px; border-radius: 12px; font-weight: 600; }
.review-title { font-size: 20px; font-weight: 700; color: #222; }
.review-sub { font-size: 14px; color: #999; margin-bottom: 28px; }
.review-lbl { font-size: 13px; color: #888; margin-bottom: 6px; font-weight: 500; }
.review-field { width: 100%; border: 2px solid #eee; border-radius: 12px; padding: 13px 16px; font-size: 15px; outline: none; margin-bottom: 20px; transition: border-color 0.2s; font-family: inherit; resize: none; }
.review-field:focus { border-color: #E8302A; }
.review-btns { display: flex; gap: 12px; }
.review-skip { flex: 1; padding: 14px; border-radius: 12px; border: 2px solid #eee; background: #fff; color: #999; font-size: 15px; cursor: pointer; font-family: inherit; }
.review-confirm { flex: 2; padding: 14px; border-radius: 12px; border: none; background: #E8302A; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }

/* 앨범 */
#album-screen { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; z-index: 60; padding: 48px; background: linear-gradient(180deg,#7EC8E3 0%,#A4D8EC 45%,#C8ECF8 100%); overflow-y: auto; }
#album-screen h2 { font-size: 36px; font-weight: 700; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.15); margin-bottom: 8px; }
#album-screen p { font-size: 18px; color: rgba(255,255,255,0.8); margin-bottom: 40px; }
#album-grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; max-width: 1600px; }
.postcard { width: 320px; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.18); animation: cardPop 0.4s ease both; flex-shrink: 0; }
@keyframes cardPop { from{transform:scale(0.85) translateY(20px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
.postcard-sky { height: 140px; position: relative; display: flex; align-items: center; justify-content: center; }
.postcard-sky .pc-time { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9); position: absolute; top: 12px; right: 14px; background: rgba(0,0,0,0.18); padding: 3px 10px; border-radius: 10px; }
.postcard-sky .pc-num { font-size: 48px; }
.postcard-body { background: #fff; padding: 20px; }
.postcard-task { font-size: 18px; font-weight: 700; color: #222; margin-bottom: 4px; }
.postcard-time { font-size: 13px; color: #E8302A; font-weight: 600; margin-bottom: 14px; }
.postcard-divider { height: 1px; background: #f0f0f0; margin-bottom: 14px; }
.postcard-lbl { font-size: 11px; color: #bbb; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
.postcard-text { font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 12px; }

/* 오버레이 공통 */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 200; }
.card { background: #fff; border-radius: 28px; padding: 40px 36px; width: 420px; box-shadow: 0 12px 48px rgba(0,0,0,0.22); }
.card h3 { font-size: 22px; color: #222; margin-bottom: 8px; font-weight: 600; }
.card p { font-size: 15px; color: #999; margin-bottom: 28px; }
.count-row { display: flex; align-items: center; justify-content: center; gap: 32px; margin-bottom: 20px; }
.cbtn { width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid #E8302A; background: #fff; color: #E8302A; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.cbtn:hover { background: #E8302A; color: #fff; }
.cbtn:disabled { border-color: #ddd; color: #ccc; pointer-events: none; }
.cnum { font-size: 64px; font-weight: 700; color: #E8302A; min-width: 80px; text-align: center; }
.dots { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; margin-bottom: 28px; }
.dot { width: 13px; height: 13px; border-radius: 50%; background: #E8302A; transition: opacity 0.2s; }
.dot.off { opacity: 0.15; }
.pbtn { width: 100%; padding: 16px; border-radius: 14px; border: none; background: #E8302A; color: #fff; font-size: 17px; font-weight: 700; cursor: pointer; }
.lbl { font-size: 14px; color: #999; margin-bottom: 7px; }
.badge { background: #E8302A; color: #fff; font-size: 13px; padding: 3px 12px; border-radius: 12px; }
.ihead { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; font-size: 18px; font-weight: 600; color: #333; }
input.ifield { width: 100%; border: 2px solid #eee; border-radius: 12px; padding: 13px 16px; font-size: 16px; outline: none; margin-bottom: 4px; transition: border-color 0.2s; font-family: inherit; }
input.ifield:focus { border-color: #E8302A; }
input.ifield.error { border-color: #E8302A; background: #FFF5F5; }
.field-error { font-size: 12px; color: #E8302A; margin-bottom: 12px; display: none; }
.field-error.show { display: block; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }
.sbtn { flex: 1; padding: 14px; border-radius: 12px; border: 2px solid #eee; background: #fff; color: #999; font-size: 15px; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
<div id="app">
  <div class="cloud" style="width:240px;height:60px;top:7%;left:3%;animation-duration:7s"></div>
  <div class="cloud" style="width:180px;height:48px;top:15%;left:18%;animation-duration:9s"></div>
  <div class="cloud" style="width:200px;height:54px;top:5%;right:5%;animation-duration:8s"></div>
  <div class="cloud" style="width:150px;height:40px;top:20%;right:20%;animation-duration:10s"></div>
  <div id="hint">곤돌라를 탭해서 작업을 입력해보세요</div>
  <canvas id="ferris-canvas" width="640" height="640"></canvas>
  <div id="gondola-grid"></div>
  <button id="start-btn" onclick="startWheel()">▶ 시작하기</button>
  <button id="pause-btn" onclick="togglePause()">⏸ 일시정지</button>
  <div id="timer-ui">
    <div id="timer-task"></div>
    <div id="timer-time">00:00</div>
    <div id="timer-progress"><div id="timer-bar" style="width:100%"></div></div>
    <div id="timer-count"></div>
  </div>
  <div id="transition-banner">⏰ 시간 종료! 잠깐 멈추고 회고를 남겨보세요</div>
  <div id="pause-banner">⏸ 일시정지 중 — 준비되면 다시 시작하세요</div>
  <div id="toast"></div>
  <div id="ground"></div>
  <div id="album-screen">
    <h2>🎡 오늘 하루의 앨범</h2>
    <p>완료한 작업들이 엽서로 기록됐어요</p>
    <div id="album-grid"></div>
  </div>
</div>

<!-- 회고 오버레이 -->
<div id="review-overlay">
  <div id="review-card">
    <div class="review-header">
      <span class="review-badge" id="review-badge">곤돌라 1</span>
      <span class="review-title" id="review-title">작업 완료!</span>
    </div>
    <div class="review-sub" id="review-sub"></div>
    <div class="review-lbl">어떻게 됐나요? (선택)</div>
    <textarea class="review-field" id="review-text" rows="3" placeholder="짧게 회고를 남겨보세요..."></textarea>
    <div class="review-lbl">다음에 할 것 (선택)</div>
    <textarea class="review-field" id="action-text" rows="2" placeholder="액션아이템을 적어보세요..."></textarea>
    <div class="review-btns">
      <button class="review-skip" onclick="skipReview()">건너뛰기</button>
      <button class="review-confirm" onclick="confirmReview()">기록하고 다음으로 →</button>
    </div>
  </div>
</div>

<!-- 개수 설정 -->
<div class="overlay" id="ov-count">
  <div class="card">
    <h3>오늘 몇 개의 작업을 할까요?</h3>
    <p>곤돌라 수 = 작업 수 (2~12개)</p>
    <div class="count-row">
      <button class="cbtn" id="btn-m" onclick="chg(-1)">−</button>
      <div class="cnum" id="cnum">4</div>
      <button class="cbtn" id="btn-p" onclick="chg(1)">+</button>
    </div>
    <div class="dots" id="dot-row"></div>
    <button class="pbtn" onclick="confirmCount()">이 개수로 시작하기</button>
  </div>
</div>

<!-- 작업 입력 -->
<div class="overlay" id="ov-input" style="display:none">
  <div class="card">
    <div class="ihead"><span class="badge" id="g-num">곤돌라 1</span>작업 설계</div>
    <div class="lbl">작업명</div>
    <input class="ifield" id="f-name" type="text" placeholder="어떤 작업을 할까요?"/>
    <div class="field-error" id="err-name">작업명을 입력해주세요</div>
    <div class="lbl">소요 시간 (분, 최소 1분)</div>
    <input class="ifield" id="f-time" type="number" placeholder="25" min="1"/>
    <div class="field-error" id="err-time">1분 이상 입력해주세요</div>
    <div class="btn-row">
      <button class="sbtn" onclick="closeInput()">취소</button>
      <button class="pbtn" style="flex:1;border-radius:12px;padding:14px" onclick="saveInput()">확인</button>
    </div>
  </div>
</div>

<script>
var N=4, tasks=[], selIdx=null;
var wheelAngle=-Math.PI/2, spinning=false, paused=false;
var currentTaskIdx=0, timerSeconds=0, timerTotal=0, timerInterval=null;
var records=[];
var toastTimer=null;

var canvas=document.getElementById('ferris-canvas');
var ctx=canvas.getContext('2d');
var CW=640,CH=640,CX=320,CY=300,R=220;

var skyThemes={
  morning:{bg:'linear-gradient(135deg,#C4CCE8,#E4D4EC)',emoji:'🌅',label:'오전'},
  afternoon:{bg:'linear-gradient(135deg,#7EC8E3,#C8ECF8)',emoji:'☀️',label:'오후'},
  sunset:{bg:'linear-gradient(135deg,#A898C8,#F8D8A8)',emoji:'🌇',label:'노을'},
  night:{bg:'linear-gradient(135deg,#0C0C2C,#4A3A7E)',emoji:'🌙',label:'밤'}
};
function getSkyTheme(){var h=new Date().getHours();if(h>=6&&h<12)return'morning';if(h>=12&&h<17)return'afternoon';if(h>=17&&h<20)return'sunset';return'night';}

// 토스트 알림
function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.style.display='none';},2500);
}

function getGondolaPos(i){var a=wheelAngle+(Math.PI*2/N)*i;return{x:CX+Math.cos(a)*R,y:CY+Math.sin(a)*R};}

function drawWheel(){
  ctx.clearRect(0,0,CW,CH);
  var groundY=CH-10,legSpread=R*0.52,legTop=CY+R*0.12;
  ctx.lineCap='round';
  [[-1],[1]].forEach(function(a){var d=a[0];ctx.beginPath();ctx.moveTo(CX,legTop);ctx.lineTo(CX+d*legSpread,groundY);ctx.strokeStyle='rgba(230,180,200,0.9)';ctx.lineWidth=7;ctx.stroke();});
  [0.42,0.70].forEach(function(f){ctx.beginPath();ctx.moveTo(CX-legSpread*f,legTop+(groundY-legTop)*f);ctx.lineTo(CX+legSpread*f,legTop+(groundY-legTop)*f);ctx.strokeStyle='rgba(255,255,255,0.8)';ctx.lineWidth=4;ctx.stroke();});
  ctx.beginPath();ctx.moveTo(CX-legSpread-12,groundY);ctx.lineTo(CX+legSpread+12,groundY);ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=7;ctx.stroke();
  ctx.beginPath();ctx.moveTo(CX-legSpread-8,groundY);ctx.lineTo(CX-legSpread-22,groundY+28);ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(CX+legSpread+8,groundY);ctx.lineTo(CX+legSpread+22,groundY+28);ctx.stroke();
  ctx.beginPath();ctx.moveTo(CX-legSpread-26,groundY+28);ctx.lineTo(CX+legSpread+26,groundY+28);ctx.strokeStyle='rgba(255,255,255,0.65)';ctx.lineWidth=4;ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.88)';ctx.lineWidth=5;ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,R*0.6,0,Math.PI*2);ctx.strokeStyle='rgba(255,255,255,0.28)';ctx.lineWidth=2;ctx.stroke();
  for(var i=0;i<20;i++){var a=wheelAngle+(Math.PI*2/20)*i;ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(CX+Math.cos(a)*R,CY+Math.sin(a)*R);ctx.strokeStyle='rgba(255,255,255,0.35)';ctx.lineWidth=1.8;ctx.stroke();}
  if(spinning){
    var gw=80,gh=58;
    for(var i=0;i<N;i++){
      var pos=getGondolaPos(i),gx=pos.x,gy=pos.y,bx=gx-gw/2,by=gy+10;
      ctx.beginPath();ctx.moveTo(gx-3,gy);ctx.lineTo(bx+gw*0.2,by);ctx.strokeStyle='rgba(255,255,255,0.75)';ctx.lineWidth=1.5;ctx.stroke();
      ctx.beginPath();ctx.moveTo(gx+3,gy);ctx.lineTo(bx+gw*0.8,by);ctx.stroke();
      var isCur=(i===currentTaskIdx);
      ctx.beginPath();ctx.roundRect(bx,by,gw,gh,gh*0.35);
      ctx.fillStyle=isCur?'#FF6B66':'#E8302A';ctx.fill();
      ctx.strokeStyle=isCur?'#FFE0E0':'#B82020';ctx.lineWidth=isCur?3:1.8;ctx.stroke();
      ctx.beginPath();ctx.roundRect(bx+gw*0.1,by,gw*0.8,gh*0.24,gh*0.1);ctx.fillStyle='rgba(255,255,255,0.92)';ctx.fill();
      ctx.textAlign='center';ctx.textBaseline='middle';
      if(tasks[i]){var lbl=tasks[i].name.length>4?tasks[i].name.slice(0,4)+'…':tasks[i].name;ctx.fillStyle='#fff';ctx.font='bold '+Math.round(gh*0.28)+'px sans-serif';ctx.fillText(lbl,gx,by+gh*0.68);}
      if(isCur){ctx.fillStyle='rgba(255,255,255,0.95)';ctx.font='bold '+Math.round(gh*0.2)+'px sans-serif';ctx.fillText(paused?'⏸ 일시정지':'▶ 진행중',gx,by+gh*0.3);}
    }
  }
  ctx.beginPath();ctx.arc(CX,CY,16,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.96)';ctx.fill();
  ctx.strokeStyle='rgba(230,180,200,0.9)';ctx.lineWidth=3;ctx.stroke();
  ctx.beginPath();ctx.arc(CX,CY,6,0,Math.PI*2);ctx.fillStyle='#E8302A';ctx.fill();
}

function animLoop(){
  if(spinning&&!paused) wheelAngle-=0.004;
  drawWheel();
  requestAnimationFrame(animLoop);
}

function playBell(){
  try{var ac=new(window.AudioContext||window.webkitAudioContext)();[0,0.3,0.6].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=t===0?880:t===0.3?1100:1320;o.type='sine';g.gain.setValueAtTime(0.4,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+0.6);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+0.6);});}catch(e){}
}

function renderDots(){
  var el=document.getElementById('dot-row');el.innerHTML='';
  for(var i=0;i<12;i++){var d=document.createElement('div');d.className='dot'+(i<N?'':' off');el.appendChild(d);}
  document.getElementById('cnum').textContent=N;
  document.getElementById('btn-m').disabled=N<=2;
  document.getElementById('btn-p').disabled=N>=12;
}
function chg(d){N=Math.min(12,Math.max(2,N+d));renderDots();}
function confirmCount(){
  tasks=Array.from({length:N},function(){return null;});
  document.getElementById('ov-count').style.display='none';
  renderGrid();updateHint();animLoop();
}

function renderGrid(){
  var grid=document.getElementById('gondola-grid');grid.innerHTML='';
  for(var i=0;i<N;i++){
    var item=document.createElement('div');
    item.className='gondola-grid-item'+(tasks[i]?' filled':'');
    item.onclick=(function(idx){return function(){openInput(idx);};})(i);
    if(tasks[i]){
      var lbl=document.createElement('div');lbl.className='gondola-label-tag';lbl.textContent=tasks[i].name.length>7?tasks[i].name.slice(0,7)+'…':tasks[i].name;item.appendChild(lbl);
      var chk=document.createElement('div');chk.className='gondola-check';chk.textContent='✓';item.appendChild(chk);
      var nm=document.createElement('div');nm.className='gondola-name-small';nm.textContent=tasks[i].time+'분';item.appendChild(nm);
    }else{
      var num=document.createElement('div');num.className='gondola-num';num.textContent=i+1;item.appendChild(num);
    }
    grid.appendChild(item);
  }
}
function updateHint(){
  var filled=tasks.filter(function(t){return t;}).length;
  document.getElementById('hint').textContent=filled===N?'모든 작업 입력 완료! 시작해보세요 🎡':'곤돌라를 탭해서 작업을 입력해보세요 ('+filled+'/'+N+')';
  document.getElementById('start-btn').classList.toggle('on',filled===N);
}

// 5-A: 시간 0 방지 + 5-C: 취소 시 대기 복귀
function openInput(idx){
  selIdx=idx;
  document.getElementById('g-num').textContent='곤돌라 '+(idx+1);
  document.getElementById('f-name').value=tasks[idx]?tasks[idx].name:'';
  document.getElementById('f-time').value=tasks[idx]?tasks[idx].time:'';
  document.getElementById('f-name').classList.remove('error');
  document.getElementById('f-time').classList.remove('error');
  document.getElementById('err-name').classList.remove('show');
  document.getElementById('err-time').classList.remove('show');
  document.getElementById('ov-input').style.display='flex';
  setTimeout(function(){document.getElementById('f-name').focus();},100);
}
function closeInput(){
  // 5-C: 취소 → 대기 상태로 복귀 (입력 내용 버림)
  document.getElementById('ov-input').style.display='none';
  selIdx=null;
}
function saveInput(){
  var name=document.getElementById('f-name').value.trim();
  var time=parseInt(document.getElementById('f-time').value);
  var hasErr=false;
  // 5-A: 작업명 빈칸 방지
  if(!name){
    document.getElementById('f-name').classList.add('error');
    document.getElementById('err-name').classList.add('show');
    hasErr=true;
  } else {
    document.getElementById('f-name').classList.remove('error');
    document.getElementById('err-name').classList.remove('show');
  }
  // 5-A: 시간 0 또는 미입력 방지
  if(!time||time<1){
    document.getElementById('f-time').classList.add('error');
    document.getElementById('err-time').classList.add('show');
    hasErr=true;
  } else {
    document.getElementById('f-time').classList.remove('error');
    document.getElementById('err-time').classList.remove('show');
  }
  if(hasErr) return;
  tasks[selIdx]={name:name,time:time};
  closeInput();renderGrid();updateHint();
}

// 5-B: 설계 없이 시작 불가 → start-btn.on 클래스로 이미 처리됨
function startWheel(){
  // 5-B: 한 번 더 체크
  var filled=tasks.filter(function(t){return t;}).length;
  if(filled<N){showToast('모든 곤돌라에 작업을 입력해주세요!');return;}

  var gridItems=document.querySelectorAll('.gondola-grid-item');
  var canvasRect=canvas.getBoundingClientRect();
  var appRect=document.getElementById('app').getBoundingClientRect();
  var flyers=[];
  gridItems.forEach(function(item,i){
    var rect=item.getBoundingClientRect();
    var flyer=document.createElement('div');flyer.className='flying-gondola';
    flyer.style.left=(rect.left-appRect.left)+'px';flyer.style.top=(rect.top-appRect.top)+'px';
    if(tasks[i]){var nm=document.createElement('div');nm.className='fg-name';nm.textContent=tasks[i].name;flyer.appendChild(nm);}
    else{var num=document.createElement('div');num.className='fg-num';num.textContent=i+1;flyer.appendChild(num);}
    document.getElementById('app').appendChild(flyer);flyers.push(flyer);
  });
  document.getElementById('gondola-grid').style.opacity='0';
  document.getElementById('start-btn').style.display='none';
  document.getElementById('hint').style.display='none';
  setTimeout(function(){
    flyers.forEach(function(flyer,i){
      var a=-Math.PI/2+(Math.PI*2/N)*i;
      var tx=canvasRect.left-appRect.left+CX+Math.cos(a)*R-48;
      var ty=canvasRect.top-appRect.top+CY+Math.sin(a)*R+10;
      flyer.style.left=tx+'px';flyer.style.top=ty+'px';
    });
  },50);
  setTimeout(function(){
    flyers.forEach(function(f){f.style.opacity='0';});
    setTimeout(function(){
      flyers.forEach(function(f){f.remove();});
      var g=document.getElementById('gondola-grid');if(g)g.remove();
      spinning=true;currentTaskIdx=0;
      document.getElementById('pause-btn').style.display='block';
      startTimer();
    },400);
  },900);
}

// 5-D: 일시정지
function togglePause(){
  paused=!paused;
  var btn=document.getElementById('pause-btn');
  var banner=document.getElementById('pause-banner');
  if(paused){
    clearInterval(timerInterval);timerInterval=null;
    btn.textContent='▶ 재개하기';
    banner.style.display='block';
  } else {
    banner.style.display='none';
    btn.textContent='⏸ 일시정지';
    // 타이머 재개
    timerInterval=setInterval(function(){
      timerSeconds--;updateTimerDisplay();
      if(timerSeconds<=0){clearInterval(timerInterval);onTimerEnd();}
    },1000);
  }
}

// 5-E: 앱 이탈 감지 → 자동 일시정지
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&spinning&&!paused){
    togglePause();
    showToast('자리를 비워서 자동으로 일시정지했어요');
  }
});

function startTimer(){
  if(currentTaskIdx>=N){endAll();return;}
  var task=tasks[currentTaskIdx];
  timerTotal=task.time*60;timerSeconds=timerTotal;
  document.getElementById('timer-ui').style.display='block';
  document.getElementById('timer-task').textContent='📌 '+task.name;
  document.getElementById('timer-count').textContent=(currentTaskIdx+1)+' / '+N+' 번째 작업';
  updateTimerDisplay();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval=setInterval(function(){
    timerSeconds--;updateTimerDisplay();
    if(timerSeconds<=0){clearInterval(timerInterval);onTimerEnd();}
  },1000);
}
function updateTimerDisplay(){
  var m=Math.floor(timerSeconds/60),s=timerSeconds%60;
  document.getElementById('timer-time').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  document.getElementById('timer-bar').style.width=(timerSeconds/timerTotal*100)+'%';
}
function onTimerEnd(){
  spinning=false;paused=false;
  document.getElementById('pause-btn').style.display='none';
  document.getElementById('pause-banner').style.display='none';
  playBell();
  var banner=document.getElementById('transition-banner');
  banner.style.display='block';
  setTimeout(function(){banner.style.display='none';showReview();},2000);
}
function showReview(){
  var task=tasks[currentTaskIdx];
  document.getElementById('review-badge').textContent='곤돌라 '+(currentTaskIdx+1);
  document.getElementById('review-title').textContent=task.name+' 완료!';
  document.getElementById('review-sub').textContent='소요 시간: '+task.time+'분 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('review-text').value='';
  document.getElementById('action-text').value='';
  document.getElementById('review-overlay').style.display='flex';
}
// 5-D: 회고 빈칸 허용 (건너뛰기)
function confirmReview(){
  saveRecord(document.getElementById('review-text').value.trim(),document.getElementById('action-text').value.trim());
  document.getElementById('review-overlay').style.display='none';
  moveNext();
}
function skipReview(){
  saveRecord('','');
  document.getElementById('review-overlay').style.display='none';
  moveNext();
}
function saveRecord(review,action){
  var now=new Date();
  records.push({idx:currentTaskIdx,name:tasks[currentTaskIdx].name,time:tasks[currentTaskIdx].time,review:review||'(없음)',action:action||'(없음)',timeStr:now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),sky:getSkyTheme()});
}
function moveNext(){
  currentTaskIdx++;
  if(currentTaskIdx>=N){endAll();return;}
  spinning=true;paused=false;
  document.getElementById('pause-btn').style.display='block';
  document.getElementById('pause-btn').textContent='⏸ 일시정지';
  startTimer();
}
function endAll(){
  spinning=false;
  document.getElementById('timer-ui').style.display='none';
  document.getElementById('pause-btn').style.display='none';
  var albumScreen=document.getElementById('album-screen');
  albumScreen.style.display='flex';
  var grid=document.getElementById('album-grid');grid.innerHTML='';
  records.forEach(function(rec,i){
    var theme=skyThemes[rec.sky];
    var card=document.createElement('div');card.className='postcard';card.style.animationDelay=(i*0.1)+'s';
    var sky=document.createElement('div');sky.className='postcard-sky';sky.style.background=theme.bg;
    var timeTag=document.createElement('div');timeTag.className='pc-time';timeTag.textContent=rec.timeStr+' '+theme.emoji;sky.appendChild(timeTag);
    var emoji=document.createElement('div');emoji.className='pc-num';emoji.textContent='🎡';sky.appendChild(emoji);
    card.appendChild(sky);
    var body=document.createElement('div');body.className='postcard-body';
    var tn=document.createElement('div');tn.className='postcard-task';tn.textContent=rec.name;body.appendChild(tn);
    var tt=document.createElement('div');tt.className='postcard-time';tt.textContent='⏱ '+rec.time+'분 · '+theme.label;body.appendChild(tt);
    var dv=document.createElement('div');dv.className='postcard-divider';body.appendChild(dv);
    if(rec.review!=='(없음)'){var rl=document.createElement('div');rl.className='postcard-lbl';rl.textContent='회고';body.appendChild(rl);var rt=document.createElement('div');rt.className='postcard-text';rt.textContent=rec.review;body.appendChild(rt);}
    if(rec.action!=='(없음)'){var al=document.createElement('div');al.className='postcard-lbl';al.textContent='액션아이템';body.appendChild(al);var at=document.createElement('div');at.className='postcard-text';at.textContent=rec.action;body.appendChild(at);}
    card.appendChild(body);grid.appendChild(card);
  });
}

renderDots();drawWheel();
</script>
